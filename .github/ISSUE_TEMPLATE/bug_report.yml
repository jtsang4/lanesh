name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server
        - Daemon (machine side)
        - MCP tools
        - Web UI
        - CLI / installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lanesh version
      description: Output of `lanesh version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. macOS 26 arm64, Ubuntu 24.04 amd64, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `lanesh logs` or the server logs. Remove any keys or tokens.
      render: text
