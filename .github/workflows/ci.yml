name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs a change needs. Changes to workflows or build tooling
  # run everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      npm: ${{ steps.filter.outputs.npm }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared: &shared
              - ".github/workflows/**"
              - "Makefile"
            go:
              - *shared
              - "**.go"
              - "go.mod"
              - "go.sum"
              - ".golangci.yml"
              - "internal/server/scripts/**"
              - "scripts/**"
            web:
              - *shared
              - "web/**"
            npm:
              - *shared
              - "build/npm/**"
            image:
              - *shared
              - "**.go"
              - "go.mod"
              - "go.sum"
              - "web/**"
              - "build/package/**"
              - ".goreleaser.yaml"

  go-test:
    name: Go test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...

  service:
    name: Service lifecycle (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Enable systemd user services
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
      - name: Build
        shell: bash
        run: go build -o "lanesh$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/lanesh
      - name: Run service lifecycle test
        shell: bash
        run: scripts/service-test.sh "./lanesh$( [ "$RUNNER_OS" = Windows ] && echo .exe )"

  install-script:
    name: Install script (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run install script test
        shell: bash
        run: scripts/install-test.sh

  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  web:
    name: Web UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run build

  npm-launcher:
    name: npm launcher
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node --test
        working-directory: build/npm

  image:
    name: Container image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A separate cache: this job cross-compiles every platform, which
          # the shared cache saved by other jobs does not contain.
          cache-dependency-path: |
            go.sum
            .goreleaser.yaml
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: docker/setup-buildx-action@v4
      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - name: Build snapshot images
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sbom
      - name: Smoke test image
        run: |
          image=ghcr.io/jtsang4/lanesh:latest-amd64
          docker run -d --name lanesh -p 8080:8080 -v lanesh-data:/data "$image"
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' lanesh)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' lanesh | grep -qx healthy
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!doctype html>'
          owner=$(docker run --rm -v lanesh-data:/data busybox stat -c '%u' /data)
          test "$owner" = 65532 || { echo "/data is owned by uid $owner, want 65532"; exit 1; }
      - name: Container logs
        if: failure()
        run: docker logs lanesh || true
